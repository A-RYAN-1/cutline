name: Bug report
description: A change was matched wrongly, missing, listed twice, or something panicked
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest history that shows it
      description: The commands that build a tiny repository (git init, commits, merge, cherry-pick) and the cutline command you ran. Do not paste private repository content.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cutline version, git version and operating system
    validations:
      required: true
